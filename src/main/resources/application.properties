spring.application.name=mapavutt

# =============================================
# DataSource - MariaDB
# =============================================
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mapavutt}
spring.datasource.username=${DB_USERNAME:mapavutt}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# =============================================
# Flyway
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# =============================================
# SQL Logging (disabled by default; enable in dev profile)
# =============================================
spring.jpa.show-sql=false

# =============================================
# Inventory Validation
# =============================================
app.inventory.validation-mode=warn
