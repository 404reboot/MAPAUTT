spring.application.name=mapavutt

server.port=${PORT:8080}

spring.thymeleaf.prefix=${SPRING_THYMELEAF_PREFIX:classpath:/templates/}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/mapavutt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

# Configuración de tamaño máximo para subida de archivos (imágenes de especímenes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ruta del directorio de almacenamiento externo para imágenes subidas
app.upload.dir=uploads/images/

# Configuración del servicio de imágenes en la nube (Imgur API)
app.imgur.client-id=${IMGUR_CLIENT_ID:546c25a59c58ad7}

