spring.application.name=mapavutt

spring.thymeleaf.prefix=file:src/main/resources/templates/

spring.datasource.url=jdbc:mariadb://localhost:3306/mapavutt
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

# Configuración de tamaño máximo para subida de archivos (imágenes de especímenes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ruta del directorio de almacenamiento externo para imágenes subidas
app.upload.dir=uploads/images/

