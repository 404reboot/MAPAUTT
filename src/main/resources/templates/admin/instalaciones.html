<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Instalaciones - Panel Admin</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; min-height: 100vh; }
        .admin-sidebar { width: 220px; background: #2c3e50; color: #ecf0f1; padding: 1rem; }
        .admin-sidebar h3 { margin-top: 0; }
        .sidebar-nav { list-style: none; padding: 0; }
        .sidebar-nav li { margin-bottom: 0.5rem; }
        .sidebar-nav a { color: #ecf0f1; text-decoration: none; }
        .sidebar-nav a:hover { text-decoration: underline; }
        .main-content { flex: 1; padding: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #dee2e6; padding: 0.5rem 0.75rem; text-align: left; }
        th { background: #f8f9fa; }
        a.btn-edit { color: #007bff; text-decoration: none; }
        a.btn-edit:hover { text-decoration: underline; }
        .alert-success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <main class="main-content">
        <h1>Instalaciones</h1>
        <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
        <table>
            <thead>
                <tr>
                    <th>Map Key</th>
                    <th>Nombre</th>
                    <th>Tipo de Instalacion</th>
                    <th>Estado Operativo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="inst : ${instalaciones}">
                    <td th:text="${inst.mapLocation.mapKey}"></td>
                    <td th:text="${inst.mapLocation.displayName}"></td>
                    <td th:text="${inst.facilityType}"></td>
                    <td th:text="${inst.operationalStatus}"></td>
                    <td>
                        <a class="btn-edit"
                           th:href="@{/admin-panel/instalaciones/{key}/edit(key=${inst.mapLocation.mapKey})}">
                            Editar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
