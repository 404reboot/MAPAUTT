<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Editar Area Verde - Panel Admin</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; min-height: 100vh; }
        .admin-sidebar { width: 220px; background: #2c3e50; color: #ecf0f1; padding: 1rem; }
        .admin-sidebar h3 { margin-top: 0; }
        .sidebar-nav { list-style: none; padding: 0; }
        .sidebar-nav li { margin-bottom: 0.5rem; }
        .sidebar-nav a { color: #ecf0f1; text-decoration: none; }
        .sidebar-nav a:hover { text-decoration: underline; }
        .main-content { flex: 1; padding: 2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.25rem; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; max-width: 500px; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 4px;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .read-only-field { background: #e9ecef; padding: 0.5rem; border-radius: 4px; max-width: 500px; }
        .error { color: #dc3545; font-size: 0.875rem; margin-top: 0.25rem; }
        .btn-submit { background: #007bff; color: #fff; border: none; padding: 0.5rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .btn-submit:hover { background: #0056b3; }
        .btn-cancel { margin-left: 1rem; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <main class="main-content">
        <h1>Editar Area Verde</h1>

        <div class="form-group">
            <label>Map Key (solo lectura)</label>
            <div class="read-only-field" th:text="${location.mapKey}"></div>
        </div>

        <div class="form-group">
            <label>GLB Object Name (solo lectura)</label>
            <div class="read-only-field" th:text="${location.glbObjectName}"></div>
        </div>

        <form th:action="@{/admin-panel/areas-verdes/{key}/edit(key=${location.mapKey})}"
              th:object="${command}" method="post">

            <div class="form-group">
                <label for="displayName">Nombre de visualizacion *</label>
                <input type="text" id="displayName" th:field="*{displayName}" required="required"/>
                <div class="error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></div>
            </div>

            <div class="form-group">
                <label for="description">Descripcion</label>
                <textarea id="description" th:field="*{description}"></textarea>
                <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="form-group">
                <label for="sector">Sector</label>
                <input type="text" id="sector" th:field="*{sector}"/>
                <div class="error" th:if="${#fields.hasErrors('sector')}" th:errors="*{sector}"></div>
            </div>

            <div class="form-group">
                <label for="surfaceArea">Superficie (m2)</label>
                <input type="number" id="surfaceArea" th:field="*{surfaceArea}" step="0.01" min="0"/>
                <div class="error" th:if="${#fields.hasErrors('surfaceArea')}" th:errors="*{surfaceArea}"></div>
            </div>

            <button type="submit" class="btn-submit">Guardar cambios</button>
            <a class="btn-cancel" th:href="@{/admin-panel/areas-verdes}">Cancelar</a>
        </form>
    </main>
</body>
</html>
