<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - MAPAUTT</title>
    <meta name="description" content="Panel de administración de MAPAUTT para gestionar edificios y áreas verdes.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar Fragment -->
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <!-- Main Workspace -->
        <div class="main-wrapper">
            
            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="breadcrumb">
                    <span>Admin</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-active" th:text="${activeSection == 'edificios' ? 'Edificios' : 'Áreas Verdes'}">Sección</span>
                </div>
                
                <!-- Action Button in upper right -->
                <button class="btn btn-primary" onclick="openAddDialog()">
                    <span>➕</span> Agregar
                </button>
            </header>

            <!-- Main Scrollable Body Content -->
            <main class="content-body">
                <!-- Dynamically replace content using Thymeleaf Fragments -->
                <div th:replace="~{fragments/sections :: ${activeSection}}"></div>
            </main>
            
        </div>
    </div>

    <!-- Interactive HTML5 Dialog for "Agregar" -->
    <dialog id="add-dialog">
        <div class="dialog-header">
            <h3 th:text="${activeSection == 'edificios' ? 'Agregar Nuevo Edificio' : 'Agregar Nueva Área Verde'}">Agregar Elemento</h3>
            <button class="btn-close-dialog" onclick="closeAddDialog()">&times;</button>
        </div>
        
        <form id="add-form" onsubmit="handleFormSubmit(event)">
            <!-- Conditional fields for Edificios -->
            <div th:if="${activeSection == 'edificios'}">
                <div class="form-group">
                    <label for="ed-nombre">Nombre del Edificio</label>
                    <input type="text" id="ed-nombre" class="form-control" placeholder="Ej: Edificio F (Sistemas)" required>
                </div>
                <div class="form-group">
                    <label for="ed-codigo">Código</label>
                    <input type="text" id="ed-codigo" class="form-control" placeholder="Ej: ED-SYS-06" required>
                </div>
                <div class="form-group">
                    <label for="ed-pisos">Número de Pisos</label>
                    <input type="number" id="ed-pisos" class="form-control" min="1" max="20" placeholder="Ej: 3" required>
                </div>
                <div class="form-group">
                    <label for="ed-estado">Estado</label>
                    <select id="ed-estado" class="form-control">
                        <option value="Activo">Activo</option>
                        <option value="En Mantenimiento">En Mantenimiento</option>
                    </select>
                </div>
            </div>

            <!-- Conditional fields for Áreas Verdes -->
            <div th:if="${activeSection == 'areas-verdes'}">
                <div class="form-group">
                    <label for="av-nombre">Nombre del Área</label>
                    <input type="text" id="av-nombre" class="form-control" placeholder="Ej: Jardín del Este" required>
                </div>
                <div class="form-group">
                    <label for="av-sector">Sector / Ubicación</label>
                    <input type="text" id="av-sector" class="form-control" placeholder="Ej: Zona Este" required>
                </div>
                <div class="form-group">
                    <label for="av-superficie">Superficie (m²)</label>
                    <input type="number" id="av-superficie" step="0.1" class="form-control" placeholder="Ej: 450.5" required>
                </div>
                <div class="form-group">
                    <label for="av-riego">Tipo de Riego</label>
                    <select id="av-riego" class="form-control">
                        <option value="Aspersión">Aspersión</option>
                        <option value="Goteo">Goteo</option>
                        <option value="Manual">Manual</option>
                        <option value="Ninguno">Ninguno</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="av-mantenimiento">Último Mantenimiento</label>
                    <input type="text" id="av-mantenimiento" class="form-control" placeholder="Ej: 05/07/2026" required>
                </div>
            </div>

            <div class="dialog-footer">
                <button type="button" class="btn btn-secondary" onclick="closeAddDialog()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </dialog>

    <!-- Dialog JS Functionality -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const activeSection = /*[[${activeSection}]]*/ 'edificios';
        const dialog = document.getElementById('add-dialog');

        function openAddDialog() {
            dialog.showModal();
        }

        function closeAddDialog() {
            dialog.close();
            document.getElementById('add-form').reset();
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            let message = '';
            if (activeSection === 'edificios') {
                const nombre = document.getElementById('ed-nombre').value;
                const codigo = document.getElementById('ed-codigo').value;
                const pisos = document.getElementById('ed-pisos').value;
                const estado = document.getElementById('ed-estado').value;
                
                message = `¡Edificio Guardado Exitosamente!\n\nNombre: ${nombre}\nCódigo: ${codigo}\nPisos: ${pisos}\nEstado: ${estado}`;
            } else {
                const nombre = document.getElementById('av-nombre').value;
                const sector = document.getElementById('av-sector').value;
                const superficie = document.getElementById('av-superficie').value;
                const riego = document.getElementById('av-riego').value;
                const mantenimiento = document.getElementById('av-mantenimiento').value;
                
                message = `¡Área Verde Guardada Exitosamente!\n\nNombre: ${nombre}\nSector: ${sector}\nSuperficie: ${superficie} m²\nRiego: ${riego}\nÚltimo Mantenimiento: ${mantenimiento}`;
            }
            
            alert(message);
            closeAddDialog();
        }
        /*]]>*/
    </script>
</body>
</html>
