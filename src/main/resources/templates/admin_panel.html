<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - MAPAUTT</title>
    <meta name="description" content="Panel de administración de MAPAUTT para gestionar edificios y áreas verdes.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar Fragment -->
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <!-- Main Workspace -->
        <div class="main-wrapper">
            
            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="breadcrumb">
                    <span>Admin</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-active" th:text="${activeSection == 'edificios' ? 'Edificios' : (activeSection == 'areas-verdes' ? 'Áreas Verdes' : (activeSection == 'seres-vivos' ? 'Seres Vivos' : 'Editor 3D'))}">Sección</span>
                </div>
                
                <!-- Central Search Input -->
                <div th:if="${activeSection != 'map-editor'}" class="navbar-search">
                    <svg class="search-icon"><use th:href="@{/images/icons.svg#icon-search}"></use></svg>
                    <input type="text" id="table-search-input" class="search-input" placeholder="Buscar en esta sección..." onkeyup="filterTableItems(this.value)">
                </div>

                <!-- Action Buttons in upper right -->
                <button th:if="${activeSection == 'edificios' || activeSection == 'areas-verdes'}" class="btn btn-primary" onclick="openAddDialog()">
                    <svg class="icon"><use th:href="@{/images/icons.svg#icon-plus}"></use></svg> Agregar
                </button>
                <div th:if="${activeSection == 'seres-vivos'}" style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" onclick="openAddDialogFor('animal')">
                        <svg class="icon"><use th:href="@{/images/icons.svg#icon-plus}"></use></svg> Agregar Animal
                    </button>
                    <button class="btn btn-primary" onclick="openAddDialogFor('plant')">
                        <svg class="icon"><use th:href="@{/images/icons.svg#icon-plus}"></use></svg> Agregar Planta
                    </button>
                </div>
            </header>

            <!-- Main Scrollable Body Content -->
            <main class="content-body">
                <!-- Dynamically replace content using Thymeleaf Fragments -->
                <th:block th:if="${activeSection == 'edificios'}">
                    <div th:replace="~{fragments/sections :: edificios}"></div>
                </th:block>
                <th:block th:if="${activeSection == 'areas-verdes'}">
                    <div th:replace="~{fragments/sections :: areas-verdes}"></div>
                </th:block>
                <th:block th:if="${activeSection == 'seres-vivos'}">
                    <div th:replace="~{fragments/sections :: seres-vivos}"></div>
                </th:block>
                <th:block th:if="${activeSection == 'map-editor'}">
                    <div th:replace="~{fragments/sections :: map-editor}"></div>
                </th:block>
            </main>
            
        </div>
    </div>

    <!-- Reusable Dynamic Modal Fragments -->
    <div th:replace="~{fragments/modal :: item-dialog}"></div>
    <div th:replace="~{fragments/modal :: confirm-delete-dialog}"></div>

    <!-- Dialog JS Functionality -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const activeSection = /*[[${activeSection}]]*/ 'edificios';

        const sectionConfig = {
            'edificios': {
                addTitle: 'Agregar Nuevo Edificio',
                editTitle: 'Editar Edificio',
                addAction: /*[[@{/admin-panel/add-edificio}]]*/ '/admin-panel/add-edificio',
                editAction: /*[[@{/admin-panel/edit-edificio}]]*/ '/admin-panel/edit-edificio',
                deleteAction: /*[[@{/admin-panel/delete-edificio}]]*/ '/admin-panel/delete-edificio',
                label: 'el edificio',
                populateEdit: (button) => {
                    document.getElementById('ed-codigoMesh').value = button.getAttribute('data-codigomesh') || '';
                    document.getElementById('ed-nombre').value = button.getAttribute('data-nombre') || '';
                    document.getElementById('ed-carrera').value = button.getAttribute('data-carreras') || '';
                }
            },
            'areas-verdes': {
                addTitle: 'Agregar Nueva Área Verde',
                editTitle: 'Editar Área Verde',
                addAction: /*[[@{/admin-panel/add-area-verde}]]*/ '/admin-panel/add-area-verde',
                editAction: /*[[@{/admin-panel/edit-area-verde}]]*/ '/admin-panel/edit-area-verde',
                deleteAction: /*[[@{/admin-panel/delete-area-verde}]]*/ '/admin-panel/delete-area-verde',
                label: 'el área verde',
                populateEdit: (button) => {
                    document.getElementById('av-codigoMesh').value = button.getAttribute('data-codigomesh') || '';
                    document.getElementById('av-nombre').value = button.getAttribute('data-nombre') || '';
                    document.getElementById('av-sector').value = button.getAttribute('data-sector') || '';
                    document.getElementById('av-superficie').value = button.getAttribute('data-superficie') || '';
                    document.getElementById('av-descripcion').value = button.getAttribute('data-descripcion') || '';
                }
            },
            'animal': {
                addTitle: 'Agregar Nuevo Animal',
                editTitle: 'Editar Animal',
                addAction: /*[[@{/admin-panel/add-animal}]]*/ '/admin-panel/add-animal',
                editAction: /*[[@{/admin-panel/edit-animal}]]*/ '/admin-panel/edit-animal',
                deleteAction: /*[[@{/admin-panel/delete-animal}]]*/ '/admin-panel/delete-animal',
                label: 'el animal',
                populateEdit: (button) => {
                    document.getElementById('an-nombre').value = button.getAttribute('data-nombre') || '';
                    document.getElementById('an-clase').value = button.getAttribute('data-clase') || '';
                    document.getElementById('an-orden').value = button.getAttribute('data-orden') || '';
                    document.getElementById('an-familia').value = button.getAttribute('data-familia') || '';
                    document.getElementById('an-genero').value = button.getAttribute('data-genero') || '';
                    document.getElementById('an-especie').value = button.getAttribute('data-especie') || '';
                    const assetId = button.getAttribute('data-assetid') || '';
                    document.getElementById('an-assetId').value = assetId;
                    const removeFlag = document.getElementById('an-removeImage');
                    if (removeFlag) removeFlag.value = 'false';
                    
                    if (assetId) {
                        showImagePreview('an', '/images/custom/' + assetId);
                    } else {
                        hideImagePreview('an');
                    }
                }
            },
            'plant': {
                addTitle: 'Agregar Nueva Planta',
                editTitle: 'Editar Planta',
                addAction: /*[[@{/admin-panel/add-plant}]]*/ '/admin-panel/add-plant',
                editAction: /*[[@{/admin-panel/edit-plant}]]*/ '/admin-panel/edit-plant',
                deleteAction: /*[[@{/admin-panel/delete-plant}]]*/ '/admin-panel/delete-plant',
                label: 'la planta',
                populateEdit: (button) => {
                    document.getElementById('pl-nombre').value = button.getAttribute('data-nombre') || '';
                    document.getElementById('pl-division').value = button.getAttribute('data-division') || '';
                    document.getElementById('pl-clase').value = button.getAttribute('data-clase') || '';
                    document.getElementById('pl-familia').value = button.getAttribute('data-familia') || '';
                    document.getElementById('pl-genero').value = button.getAttribute('data-genero') || '';
                    document.getElementById('pl-especie').value = button.getAttribute('data-especie') || '';
                    const assetId = button.getAttribute('data-assetid') || '';
                    document.getElementById('pl-assetId').value = assetId;
                    const removeFlag = document.getElementById('pl-removeImage');
                    if (removeFlag) removeFlag.value = 'false';

                    if (assetId) {
                        showImagePreview('pl', '/images/custom/' + assetId);
                    } else {
                        hideImagePreview('pl');
                    }
                }
            }
        };

        function showImagePreview(prefix, imageSrc) {
            const dropZone = document.getElementById(prefix + '-drop-zone');
            const dropContent = document.getElementById(prefix + '-drop-content');
            const previewContainer = document.getElementById(prefix + '-preview-container');
            const img = document.getElementById(prefix + '-image-preview');

            if (img) img.src = imageSrc;
            if (previewContainer) previewContainer.style.display = 'flex';
            if (dropContent) dropContent.style.display = 'none';
            if (dropZone) dropZone.classList.add('has-image');
        }

        function hideImagePreview(prefix) {
            const dropZone = document.getElementById(prefix + '-drop-zone');
            const dropContent = document.getElementById(prefix + '-drop-content');
            const previewContainer = document.getElementById(prefix + '-preview-container');
            const img = document.getElementById(prefix + '-image-preview');

            if (img) img.src = '';
            if (previewContainer) previewContainer.style.display = 'none';
            if (dropContent) dropContent.style.display = 'flex';
            if (dropZone) dropZone.classList.remove('has-image');
        }

        function previewImage(input, prefix) {
            const removeFlag = document.getElementById(prefix + '-removeImage');
            if (removeFlag) removeFlag.value = 'false';

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    showImagePreview(prefix, e.target.result);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeSelectedImage(e, prefix) {
            if (e) {
                if (typeof e.stopPropagation === 'function') e.stopPropagation();
                if (typeof e.preventDefault === 'function') e.preventDefault();
            }
            const fileInput = document.getElementById(prefix + '-imagen');
            const existingInput = document.getElementById(prefix + '-assetId');
            const removeFlag = document.getElementById(prefix + '-removeImage');

            if (fileInput) fileInput.value = '';
            if (existingInput) existingInput.value = '';
            if (removeFlag) removeFlag.value = 'true';
            hideImagePreview(prefix);
        }

        function toggleSeresVivosFields(entityKey) {
            if (activeSection !== 'seres-vivos') return;
            const animalFields = document.getElementById('fields-animal');
            const plantFields = document.getElementById('fields-plant');
            const anInputs = animalFields ? animalFields.querySelectorAll('input') : [];
            const plInputs = plantFields ? plantFields.querySelectorAll('input') : [];

            if (entityKey === 'plant') {
                if (animalFields) animalFields.style.display = 'none';
                if (plantFields) plantFields.style.display = 'block';
                anInputs.forEach(i => i.disabled = true);
                plInputs.forEach(i => i.disabled = false);
            } else {
                if (animalFields) animalFields.style.display = 'block';
                if (plantFields) plantFields.style.display = 'none';
                anInputs.forEach(i => i.disabled = false);
                plInputs.forEach(i => i.disabled = true);
            }
        }

        function openAddDialogFor(entityKey) {
            const key = entityKey || activeSection;
            const config = sectionConfig[key] || sectionConfig['edificios'];
            const dialog = document.getElementById('item-dialog');
            const form = document.getElementById('item-form');
            form.reset();
            document.getElementById('item-id').value = '';

            const anRemove = document.getElementById('an-removeImage');
            const plRemove = document.getElementById('pl-removeImage');
            if (anRemove) anRemove.value = 'false';
            if (plRemove) plRemove.value = 'false';

            hideImagePreview('an');
            hideImagePreview('pl');

            toggleSeresVivosFields(key);

            document.getElementById('dialog-title').textContent = config.addTitle;
            form.action = config.addAction;
            document.getElementById('dialog-submit-btn').textContent = 'Guardar';
            dialog.showModal();
        }

        function openAddDialog() {
            openAddDialogFor(activeSection === 'seres-vivos' ? 'animal' : activeSection);
        }

        function openEditDialog(button) {
            const entityKey = button.getAttribute('data-entity') || activeSection;
            const config = sectionConfig[entityKey] || sectionConfig['edificios'];
            const dialog = document.getElementById('item-dialog');
            const form = document.getElementById('item-form');
            form.reset();

            const id = button.getAttribute('data-id');
            document.getElementById('item-id').value = id;

            toggleSeresVivosFields(entityKey);

            document.getElementById('dialog-title').textContent = config.editTitle;
            form.action = config.editAction;

            if (config.populateEdit) {
                config.populateEdit(button);
            }

            document.getElementById('dialog-submit-btn').textContent = 'Guardar Cambios';
            dialog.showModal();
        }

        function closeItemDialog() {
            const dialog = document.getElementById('item-dialog');
            dialog.close();
            document.getElementById('item-form').reset();
        }

        function deleteItemEntity(button) {
            const entityKey = button.getAttribute('data-entity') || activeSection;
            const id = button.getAttribute('data-id');
            const nombre = button.getAttribute('data-nombre');
            deleteItem(id, nombre, entityKey);
        }

        function deleteItem(id, nombre, entityKey) {
            const key = entityKey || activeSection;
            const config = sectionConfig[key] || sectionConfig['edificios'];
            const dialog = document.getElementById('confirm-delete-dialog');
            const form = document.getElementById('delete-form');
            document.getElementById('delete-item-id').value = id;

            document.getElementById('delete-confirm-message').textContent = `¿Seguro que deseas eliminar ${config.label} "${nombre}"?`;
            form.action = config.deleteAction;

            dialog.showModal();
        }

        function closeConfirmDeleteDialog() {
            const dialog = document.getElementById('confirm-delete-dialog');
            dialog.close();
        }

        function filterTableItems(query) {
            const filter = (query || '').toLowerCase().trim();
            const rows = document.querySelectorAll('.content-body .data-table tbody tr');
            
            rows.forEach(row => {
                // Ignore empty state rows
                if (row.cells.length === 1 && row.cells[0].classList.contains('text-center')) {
                    return;
                }
                const text = row.textContent.toLowerCase();
                if (text.includes(filter)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        function setupDragAndDrop(prefix) {
            const dropZone = document.getElementById(prefix + '-drop-zone');
            const fileInput = document.getElementById(prefix + '-imagen');
            if (!dropZone || !fileInput) return;

            dropZone.addEventListener('click', (e) => {
                if (dropZone.classList.contains('has-image')) return;
                fileInput.click();
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (!dropZone.classList.contains('has-image')) {
                        dropZone.classList.add('drag-over');
                    }
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dropZone.classList.remove('drag-over');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                if (dropZone.classList.contains('has-image')) return;
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(files[0]);
                    fileInput.files = dataTransfer.files;
                    previewImage(fileInput, prefix);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupDragAndDrop('an');
            setupDragAndDrop('pl');
        });
        /*]]>*/
    </script>
</body>
</html>
