<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - MAPAUTT</title>
    <meta name="description" content="Panel de administración de MAPAUTT para gestionar edificios y áreas verdes.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar Fragment -->
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <!-- Main Workspace -->
        <div class="main-wrapper">
            
            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="breadcrumb">
                    <span>Admin</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-active" th:text="${activeSection == 'edificios' ? 'Edificios' : (activeSection == 'areas-verdes' ? 'Áreas Verdes' : 'Editor 3D')}">Sección</span>
                </div>
                
                <!-- Action Button in upper right -->
                <button th:if="${activeSection != 'map-editor'}" class="btn btn-primary" onclick="openAddDialog()">
                    <span>➕</span> Agregar
                </button>
            </header>

            <!-- Main Scrollable Body Content -->
            <main class="content-body">
                <!-- Dynamically replace content using Thymeleaf Fragments -->
                <th:block th:if="${activeSection == 'edificios'}">
                    <div th:replace="~{fragments/sections :: edificios}"></div>
                </th:block>
                <th:block th:if="${activeSection == 'areas-verdes'}">
                    <div th:replace="~{fragments/sections :: areas-verdes}"></div>
                </th:block>
                <th:block th:if="${activeSection == 'map-editor'}">
                    <div th:replace="~{fragments/sections :: map-editor}"></div>
                </th:block>
            </main>
            
        </div>
    </div>

    <!-- Interactive HTML5 Dialog for "Agregar" -->
    <dialog id="add-dialog">
        <div class="dialog-header">
            <h3 th:text="${activeSection == 'edificios' ? 'Agregar Nuevo Edificio' : 'Agregar Nueva Área Verde'}">Agregar Elemento</h3>
            <button class="btn-close-dialog" onclick="closeAddDialog()">&times;</button>
        </div>
        
        <form id="add-form" method="POST" th:action="@{${activeSection == 'edificios' ? '/admin-panel/add-edificio' : '/admin-panel/add-area-verde'}}">
            <!-- Conditional fields for Edificios -->
            <div th:if="${activeSection == 'edificios'}">
                <div class="form-group">
                    <label for="ed-codigoMesh">Identificador del Mapa 3D</label>
                    <input type="text" id="ed-codigoMesh" name="codigoMesh" class="form-control" placeholder="Ej: E" required>
                </div>
                <div class="form-group">
                    <label for="ed-nombre">Nombre Público</label>
                    <input type="text" id="ed-nombre" name="nombre" class="form-control" placeholder="Ej: Edificio Central" required>
                </div>
                <div class="form-group">
                    <label for="ed-carrera">Carrera / Uso</label>
                    <input type="text" id="ed-carrera" name="carreras" class="form-control" placeholder="Ej: Sistemas" required>
                </div>
                <div class="form-group">
                    <label for="ed-pisos">Número de Pisos</label>
                    <input type="number" id="ed-pisos" name="pisos" class="form-control" min="1" max="20" placeholder="Ej: 3" required>
                </div>
                <div class="form-group">
                    <label for="ed-estado">Estado</label>
                    <select id="ed-estado" name="estado" class="form-control">
                        <option value="Activo">Activo</option>
                        <option value="En Mantenimiento">En Mantenimiento</option>
                    </select>
                </div>
            </div>

            <!-- Conditional fields for Áreas Verdes -->
            <div th:if="${activeSection == 'areas-verdes'}">
                <div class="form-group">
                    <label for="av-codigoMesh">Identificador del Mapa 3D</label>
                    <input type="text" id="av-codigoMesh" name="codigoMesh" class="form-control" placeholder="Ej: Jardin_Norte" required>
                </div>
                <div class="form-group">
                    <label for="av-nombre">Nombre del Área</label>
                    <input type="text" id="av-nombre" name="nombre" class="form-control" placeholder="Ej: Jardín Principal" required>
                </div>
                <div class="form-group">
                    <label for="av-sector">Sector / Ubicación</label>
                    <input type="text" id="av-sector" name="sector" class="form-control" placeholder="Ej: Zona Este" required>
                </div>
                <div class="form-group">
                    <label for="av-superficie">Superficie (m²)</label>
                    <input type="number" id="av-superficie" name="superficie" step="0.1" class="form-control" placeholder="Ej: 450.5" required>
                </div>
                <div class="form-group">
                    <label for="av-descripcion">Descripción</label>
                    <textarea id="av-descripcion" name="descripcion" class="form-control" placeholder="" rows="3"></textarea>
                </div>
            </div>

            <div class="dialog-footer">
                <button type="button" class="btn btn-secondary" onclick="closeAddDialog()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </dialog>

    <!-- Interactive HTML5 Dialog for "Editar" -->
    <dialog id="edit-dialog">
        <div class="dialog-header">
            <h3 th:text="${activeSection == 'edificios' ? 'Editar Edificio' : 'Editar Área Verde'}">Editar Elemento</h3>
            <button class="btn-close-dialog" onclick="closeEditDialog()">&times;</button>
        </div>
        
        <form id="edit-form" method="POST" th:action="@{${activeSection == 'edificios' ? '/admin-panel/edit-edificio' : '/admin-panel/edit-area-verde'}}">
            <!-- Hidden field for ID -->
            <input type="hidden" id="edit-id" name="id">

            <!-- Conditional fields for Edificios -->
            <div th:if="${activeSection == 'edificios'}">
                <div class="form-group">
                    <label for="edit-ed-codigoMesh">Identificador del Mapa 3D</label>
                    <input type="text" id="edit-ed-codigoMesh" name="codigoMesh" class="form-control" placeholder="Ej: E" required>
                </div>
                <div class="form-group">
                    <label for="edit-ed-nombre">Nombre Público</label>
                    <input type="text" id="edit-ed-nombre" name="nombre" class="form-control" placeholder="Ej: Edificio Central" required>
                </div>
                <div class="form-group">
                    <label for="edit-ed-carrera">Carrera / Uso</label>
                    <input type="text" id="edit-ed-carrera" name="carreras" class="form-control" placeholder="Ej: Sistemas" required>
                </div>
                <div class="form-group">
                    <label for="edit-ed-pisos">Número de Pisos</label>
                    <input type="number" id="edit-ed-pisos" name="pisos" class="form-control" min="1" max="20" placeholder="Ej: 3" required>
                </div>
                <div class="form-group">
                    <label for="edit-ed-estado">Estado</label>
                    <select id="edit-ed-estado" name="estado" class="form-control">
                        <option value="Activo">Activo</option>
                        <option value="En Mantenimiento">En Mantenimiento</option>
                    </select>
                </div>
            </div>

            <!-- Conditional fields for Áreas Verdes -->
            <div th:if="${activeSection == 'areas-verdes'}">
                <div class="form-group">
                    <label for="edit-av-codigoMesh">Identificador del Mapa 3D</label>
                    <input type="text" id="edit-av-codigoMesh" name="codigoMesh" class="form-control" placeholder="Ej: Jardin_Norte" required>
                </div>
                <div class="form-group">
                    <label for="edit-av-nombre">Nombre del Área</label>
                    <input type="text" id="edit-av-nombre" name="nombre" class="form-control" placeholder="Ej: Jardín Principal" required>
                </div>
                <div class="form-group">
                    <label for="edit-av-sector">Sector / Ubicación</label>
                    <input type="text" id="edit-av-sector" name="sector" class="form-control" placeholder="Ej: Zona Este" required>
                </div>
                <div class="form-group">
                    <label for="edit-av-superficie">Superficie (m²)</label>
                    <input type="number" id="edit-av-superficie" name="superficie" step="0.1" class="form-control" placeholder="Ej: 450.5" required>
                </div>
                <div class="form-group">
                    <label for="edit-av-descripcion">Descripción</label>
                    <textarea id="edit-av-descripcion" name="descripcion" class="form-control" placeholder="" rows="3"></textarea>
                </div>
            </div>

            <div class="dialog-footer">
                <button type="button" class="btn btn-secondary" onclick="closeEditDialog()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </div>
        </form>
    </dialog>

    <!-- Dialog JS Functionality -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const activeSection = /*[[${activeSection}]]*/ 'edificios';
        const dialog = document.getElementById('add-dialog');
        const editDialog = document.getElementById('edit-dialog');

        function openAddDialog() {
            dialog.showModal();
        }

        function closeAddDialog() {
            dialog.close();
            document.getElementById('add-form').reset();
        }

        function openEditDialog(button) {
            const id = button.getAttribute('data-id');
            document.getElementById('edit-id').value = id;

            if (activeSection === 'edificios') {
                document.getElementById('edit-ed-codigoMesh').value = button.getAttribute('data-codigomesh');
                document.getElementById('edit-ed-nombre').value = button.getAttribute('data-nombre');
                document.getElementById('edit-ed-carrera').value = button.getAttribute('data-carreras');
                document.getElementById('edit-ed-pisos').value = button.getAttribute('data-pisos');
                document.getElementById('edit-ed-estado').value = button.getAttribute('data-estado');
            } else {
                document.getElementById('edit-av-codigoMesh').value = button.getAttribute('data-codigomesh');
                document.getElementById('edit-av-nombre').value = button.getAttribute('data-nombre');
                document.getElementById('edit-av-sector').value = button.getAttribute('data-sector');
                document.getElementById('edit-av-superficie').value = button.getAttribute('data-superficie');
                document.getElementById('edit-av-descripcion').value = button.getAttribute('data-descripcion');
            }
            editDialog.showModal();
        }

        function closeEditDialog() {
            editDialog.close();
            document.getElementById('edit-form').reset();
        }

        function deleteItem(id, nombre) {
            const confirmMessage = activeSection === 'edificios' 
                ? `¿Seguro que deseas eliminar el edificio: ${nombre}?`
                : `¿Seguro que deseas eliminar el área verde: ${nombre}?`;

            if (confirm(confirmMessage)) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = activeSection === 'edificios' 
                    ? '/admin-panel/delete-edificio' 
                    : '/admin-panel/delete-area-verde';
                
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'id';
                input.value = id;
                
                form.appendChild(input);
                document.body.appendChild(form);
                form.submit();
            }
        }
        /*]]>*/
    </script>
</body>
</html>
