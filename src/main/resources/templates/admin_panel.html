<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - MAPAUTT</title>
    <meta name="description" content="Panel de administración de MAPAUTT para gestionar edificios y áreas verdes.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar Fragment -->
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <!-- Main Workspace -->
        <div class="main-wrapper">
            
            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="breadcrumb">
                    <span>Admin</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-active" th:text="${activeSection == 'edificios' ? 'Edificios' : (activeSection == 'areas-verdes' ? 'Áreas Verdes' : 'Editor 3D')}">Sección</span>
                </div>
                
                <!-- Action Button in upper right -->
                <button th:if="${activeSection != 'map-editor'}" class="btn btn-primary" onclick="openAddDialog()">
                    <svg class="icon"><use th:href="@{/images/icons.svg#icon-plus}"></use></svg> Agregar
                </button>
            </header>

            <!-- Main Scrollable Body Content -->
            <main class="content-body">
                <!-- Dynamically replace content using Thymeleaf Fragments -->
                <th:block th:if="${activeSection == 'edificios'}">
                    <div th:replace="~{fragments/sections :: edificios}"></div>
                </th:block>
                <th:block th:if="${activeSection == 'areas-verdes'}">
                    <div th:replace="~{fragments/sections :: areas-verdes}"></div>
                </th:block>
                <th:block th:if="${activeSection == 'map-editor'}">
                    <div th:replace="~{fragments/sections :: map-editor}"></div>
                </th:block>
            </main>
            
        </div>
    </div>

    <!-- Reusable Dynamic Modal Fragments -->
    <div th:replace="~{fragments/modal :: item-dialog}"></div>
    <div th:replace="~{fragments/modal :: confirm-delete-dialog}"></div>

    <!-- Dialog JS Functionality -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const activeSection = /*[[${activeSection}]]*/ 'edificios';

        function openAddDialog() {
            const dialog = document.getElementById('item-dialog');
            const form = document.getElementById('item-form');
            form.reset();
            document.getElementById('item-id').value = '';

            if (activeSection === 'edificios') {
                document.getElementById('dialog-title').textContent = 'Agregar Nuevo Edificio';
                form.action = /*[[@{/admin-panel/add-edificio}]]*/ '/admin-panel/add-edificio';
            } else {
                document.getElementById('dialog-title').textContent = 'Agregar Nueva Área Verde';
                form.action = /*[[@{/admin-panel/add-area-verde}]]*/ '/admin-panel/add-area-verde';
            }
            document.getElementById('dialog-submit-btn').textContent = 'Guardar';
            dialog.showModal();
        }

        function openEditDialog(button) {
            const dialog = document.getElementById('item-dialog');
            const form = document.getElementById('item-form');
            form.reset();

            const id = button.getAttribute('data-id');
            document.getElementById('item-id').value = id;

            if (activeSection === 'edificios') {
                document.getElementById('dialog-title').textContent = 'Editar Edificio';
                form.action = /*[[@{/admin-panel/edit-edificio}]]*/ '/admin-panel/edit-edificio';
                document.getElementById('ed-codigoMesh').value = button.getAttribute('data-codigomesh') || '';
                document.getElementById('ed-nombre').value = button.getAttribute('data-nombre') || '';
                document.getElementById('ed-carrera').value = button.getAttribute('data-carreras') || '';
            } else {
                document.getElementById('dialog-title').textContent = 'Editar Área Verde';
                form.action = /*[[@{/admin-panel/edit-area-verde}]]*/ '/admin-panel/edit-area-verde';
                document.getElementById('av-codigoMesh').value = button.getAttribute('data-codigomesh') || '';
                document.getElementById('av-nombre').value = button.getAttribute('data-nombre') || '';
                document.getElementById('av-sector').value = button.getAttribute('data-sector') || '';
                document.getElementById('av-superficie').value = button.getAttribute('data-superficie') || '';
                document.getElementById('av-descripcion').value = button.getAttribute('data-descripcion') || '';
            }
            document.getElementById('dialog-submit-btn').textContent = 'Guardar Cambios';
            dialog.showModal();
        }

        function closeItemDialog() {
            const dialog = document.getElementById('item-dialog');
            dialog.close();
            document.getElementById('item-form').reset();
        }

        function deleteItem(id, nombre) {
            const dialog = document.getElementById('confirm-delete-dialog');
            const form = document.getElementById('delete-form');
            document.getElementById('delete-item-id').value = id;

            const itemType = activeSection === 'edificios' ? 'el edificio' : 'el área verde';
            document.getElementById('delete-confirm-message').textContent = `¿Seguro que deseas eliminar ${itemType} "${nombre}"?`;

            form.action = activeSection === 'edificios' 
                ? /*[[@{/admin-panel/delete-edificio}]]*/ '/admin-panel/delete-edificio' 
                : /*[[@{/admin-panel/delete-area-verde}]]*/ '/admin-panel/delete-area-verde';

            dialog.showModal();
        }

        function closeConfirmDeleteDialog() {
            const dialog = document.getElementById('confirm-delete-dialog');
            dialog.close();
        }
        /*]]>*/
    </script>
</body>
</html>
