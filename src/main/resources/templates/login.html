<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MAPAUTT</title>
    <meta name="description" content="Inicie sesión para acceder al panel de administración y gestionar las áreas verdes y edificios de la universidad.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="centered-layout">

    <div class="container" style="max-width: 50%;">
        <main class="card">
            <!-- Logo area -->
            <div class="logo-area">
                <span class="logo-icon">🗺️</span>
                <h1 id="login-title" class="logo-text">MAPAUTT</h1>
                <p class="subtitle">Panel de Administración</p>
            </div>

            <!-- Error and Warning Alerts -->
            <div id="login-alert-error" class="alert alert-danger" th:if="${param.error != null}">
                <span>⚠️</span>
                <span th:if="${param.error[0] == 'true'}">Nombre de usuario o contraseña incorrectos.</span>
                <span th:if="${param.error[0] == 'unauthorized'}">Acceso denegado. Por favor, inicie sesión.</span>
            </div>

            <!-- Logout Alert -->
            <div id="login-alert-success" class="alert alert-success" th:if="${param.logout != null}">
                <span>✓</span>
                <span>Sesión cerrada correctamente. ¡Hasta pronto!</span>
            </div>

            <!-- Form -->
            <form id="login-form" th:action="@{/acceso}" method="post">
                <!-- Username -->
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <div class="input-container">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" class="form-control" 
                               placeholder="Nombre de usuario" required autocomplete="username">
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-container">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="Contraseña" required autocomplete="current-password">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-login-submit" class="btn-submit">
                    <span>Entrar</span>
                    <span>➔</span>
                </button>
            </form>

            <!-- Credentials Tip -->
            <!-- <div class="credentials-tip"> -->
            <!--     Tip: Usa el usuario <code>admin</code> y contraseña <code>admin123</code> -->
            <!-- </div> -->

            <!-- Back link -->
            <a th:href="@{/}" id="link-back-welcome" class="back-home">
                <span>←</span> Volver al Inicio
            </a>
        </main>

        <footer>
            <p>© 2026 MAPAUTT - Desarrollado con Spring Boot & Thymeleaf</p>
        </footer>
    </div>

</body>
</html>
