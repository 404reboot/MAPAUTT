<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- Unified Dynamic Modal Fragment for Adding / Editing Items -->
    <dialog th:fragment="item-dialog" id="item-dialog">
        <div class="dialog-header">
            <h3 id="dialog-title">Agregar Elemento</h3>
            <button class="btn-close-dialog" onclick="closeItemDialog()" aria-label="Cerrar">
                <svg class="icon"><use th:href="@{/images/icons.svg#icon-x}"></use></svg>
            </button>
        </div>
        
        <form id="item-form" class="dialog-form" method="POST" action="">
            <div class="dialog-body">
                <!-- Hidden field for ID (empty on Add, populated on Edit) -->
                <input type="hidden" id="item-id" name="id">

                <!-- Conditional fields for Edificios -->
                <div th:if="${activeSection == 'edificios'}">
                    <div class="form-group">
                        <label for="ed-codigoMesh">Identificador del Mapa 3D</label>
                        <input type="text" id="ed-codigoMesh" name="codigoMesh" class="form-control" placeholder="Ej: E" required>
                    </div>
                    <div class="form-group">
                        <label for="ed-nombre">Nombre Público</label>
                        <input type="text" id="ed-nombre" name="nombre" class="form-control" placeholder="Ej: Edificio Central" required>
                    </div>
                    <div class="form-group">
                        <label for="ed-carrera">Carrera / Uso</label>
                        <input type="text" id="ed-carrera" name="carreras" class="form-control" placeholder="Ej: Sistemas" required>
                    </div>
                </div>

                <!-- Conditional fields for Áreas Verdes -->
                <div th:if="${activeSection == 'areas-verdes'}">
                    <div class="form-group">
                        <label for="av-codigoMesh">Identificador del Mapa 3D</label>
                        <input type="text" id="av-codigoMesh" name="codigoMesh" class="form-control" placeholder="Ej: Jardin_Norte" required>
                    </div>
                    <div class="form-group">
                        <label for="av-nombre">Nombre del Área</label>
                        <input type="text" id="av-nombre" name="nombre" class="form-control" placeholder="Ej: Jardín Principal" required>
                    </div>
                    <div class="form-group">
                        <label for="av-sector">Sector / Ubicación</label>
                        <input type="text" id="av-sector" name="sector" class="form-control" placeholder="Ej: Zona Este" required>
                    </div>
                    <div class="form-group">
                        <label for="av-superficie">Superficie (m²)</label>
                        <input type="number" id="av-superficie" name="superficie" step="0.1" class="form-control" placeholder="Ej: 450.5" required>
                    </div>
                    <div class="form-group">
                        <label for="av-descripcion">Descripción</label>
                        <textarea id="av-descripcion" name="descripcion" class="form-control" placeholder="" rows="3"></textarea>
                    </div>
                </div>

                <!-- Conditional fields for Seres Vivos -->
                <div th:if="${activeSection == 'seres-vivos'}">
                    <!-- Fields for Animal -->
                    <div id="fields-animal" class="entity-fields">
                        <div class="form-group">
                            <label for="an-nombre">Nombre Común *</label>
                            <input type="text" id="an-nombre" name="nombre" class="form-control an-input" placeholder="Ej: Gato del Campus" required>
                        </div>
                        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div>
                                <label for="an-clase">Clase</label>
                                <input type="text" id="an-clase" name="clase" class="form-control an-input" placeholder="Ej: Mammalia">
                            </div>
                            <div>
                                <label for="an-orden">Orden</label>
                                <input type="text" id="an-orden" name="orden" class="form-control an-input" placeholder="Ej: Carnivora">
                            </div>
                        </div>
                        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div>
                                <label for="an-familia">Familia</label>
                                <input type="text" id="an-familia" name="familia" class="form-control an-input" placeholder="Ej: Felidae">
                            </div>
                            <div>
                                <label for="an-genero">Género</label>
                                <input type="text" id="an-genero" name="genero" class="form-control an-input" placeholder="Ej: Felis">
                            </div>
                        </div>
                        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div>
                                <label for="an-especie">Especie *</label>
                                <input type="text" id="an-especie" name="especie" class="form-control an-input" placeholder="Ej: catus" required>
                            </div>
                            <div>
                                <label for="an-assetId">Identificador de Imagen (Asset ID)</label>
                                <input type="text" id="an-assetId" name="assetId" class="form-control an-input" placeholder="Ej: gato.png">
                            </div>
                        </div>
                    </div>

                    <!-- Fields for Plant -->
                    <div id="fields-plant" class="entity-fields" style="display: none;">
                        <div class="form-group">
                            <label for="pl-nombre">Nombre Común *</label>
                            <input type="text" id="pl-nombre" name="nombre" class="form-control pl-input" placeholder="Ej: Jacaranda" required>
                        </div>
                        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div>
                                <label for="pl-division">División</label>
                                <input type="text" id="pl-division" name="division" class="form-control pl-input" placeholder="Ej: Magnoliophyta">
                            </div>
                            <div>
                                <label for="pl-clase">Clase</label>
                                <input type="text" id="pl-clase" name="clase" class="form-control pl-input" placeholder="Ej: Magnoliopsida">
                            </div>
                        </div>
                        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div>
                                <label for="pl-familia">Familia</label>
                                <input type="text" id="pl-familia" name="familia" class="form-control pl-input" placeholder="Ej: Bignoniaceae">
                            </div>
                            <div>
                                <label for="pl-genero">Género</label>
                                <input type="text" id="pl-genero" name="genero" class="form-control pl-input" placeholder="Ej: Jacaranda">
                            </div>
                        </div>
                        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div>
                                <label for="pl-especie">Especie *</label>
                                <input type="text" id="pl-especie" name="especie" class="form-control pl-input" placeholder="Ej: mimosifolia" required>
                            </div>
                            <div>
                                <label for="pl-assetId">Identificador de Imagen (Asset ID)</label>
                                <input type="text" id="pl-assetId" name="assetId" class="form-control pl-input" placeholder="Ej: jacaranda.png">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="dialog-footer">
                <button type="button" class="btn btn-secondary" onclick="closeItemDialog()">Cancelar</button>
                <button type="submit" id="dialog-submit-btn" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </dialog>

    <!-- Confirmation Dialog Fragment for Deleting Items -->
    <dialog th:fragment="confirm-delete-dialog" id="confirm-delete-dialog">
        <div class="dialog-header">
            <div class="dialog-header-left">
                <div class="dialog-icon-danger">
                    <svg class="icon"><use th:href="@{/images/icons.svg#icon-trash}"></use></svg>
                </div>
                <h3>Confirmar Eliminación</h3>
            </div>
            <button class="btn-close-dialog" onclick="closeConfirmDeleteDialog()" aria-label="Cerrar">
                <svg class="icon"><use th:href="@{/images/icons.svg#icon-x}"></use></svg>
            </button>
        </div>
        
        <form id="delete-form" class="dialog-form" method="POST" action="">
            <div class="dialog-body">
                <input type="hidden" id="delete-item-id" name="id">
                <p class="dialog-confirm-message" id="delete-confirm-message">¿Estás seguro de eliminar este elemento?</p>
                <p class="dialog-confirm-subtext">Esta acción no se puede deshacer.</p>
            </div>

            <div class="dialog-footer">
                <button type="button" class="btn btn-secondary" onclick="closeConfirmDeleteDialog()">Cancelar</button>
                <button type="submit" class="btn btn-danger">Eliminar</button>
            </div>
        </form>
    </dialog>

</body>
</html>
