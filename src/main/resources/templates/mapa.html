<!--
    Autor: Cristobal Torres Ramos
    Proyecto: Mapa interactivo de la UTTECAM
-->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">
        Mapa 3D UTTECAM (Blender)
    </title>

    <!-- Fuente externa -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/stylesmapa.css}">
    <link rel="stylesheet" th:href="@{/css/stylesmascota.css}">

    <!-- Librerías Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>


    <!-- Postprocesado para contornos -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/OutlinePass.js"></script>

</head>

<body>

    <!-- Pantalla de carga mientras se descarga el modelo GLB -->
    <div id="loader">

        <h2>
            Cargando Mapa 3D UTTECAM...
        </h2>

        <p>
            Por favor espera un momento
        </p>

    </div>

    <!-- Botón volver -->
    <div class="back-button-overlay">

        <a th:href="@{/}" class="btn-secondary">
            <svg class="icon">
                <use th:href="@{/images/icons.svg#icon-arrow-left}"></use>
            </svg>
            Volver
        </a>

    </div>

    <!-- ==========================================
     BUSCADOR DEL MAPA
     ========================================== -->
    <div id="map-search-container">

        <div id="map-search-box">

            <span id="map-search-icon">⌕</span>

            <input type="search" id="map-search-input" placeholder="Buscar edificio, carrera o uso..."
                autocomplete="off" aria-label="Buscar en el mapa">

            <button id="map-search-clear" type="button" aria-label="Limpiar búsqueda" title="Limpiar búsqueda">
                X
            </button>

        </div>

        <!-- Resultados del buscador -->
        <div id="map-search-results" class="map-search-results" aria-hidden="true">
        </div>

    </div>

    <!-- Contenedor donde Three.js crea el Canvas -->
    <div id="webgl-container"></div>

    <!-- Tarjeta lateral de información -->
    <div id="details-card" class="floating-details-card">

        <div id="card-hero-container" class="card-hero-container"></div>

        <img class="mascota-viewing" th:src="@{/css/mascota_viewing_transparent.png}" alt="Mascota observando">

        <div class="card-drag-handle"></div>

        <div class="card-header-overlay">
            <div class="card-header-left">
                <button id="card-back-btn" class="btn-card-back" style="display: none;" onclick="goBackToAreaCard()"
                    title="Volver al área verde" aria-label="Volver al área verde">
                    <svg class="icon" style="width: 16px; height: 16px;">
                        <use th:href="@{/images/icons.svg#icon-arrow-left}"></use>
                    </svg>
                </button>
                <h3 id="card-title">Detalle</h3>
            </div>
            <button class="close-btn" onclick="closeDetailsCard()">&times;</button>
        </div>

        <div id="card-body" class="card-content-body"></div>

    </div>

    <!-- Controles del mapa -->
    <div class="map-controls-overlay">

        <!-- ==========================================
     BRÚJULA DE ORIENTACIÓN
     ========================================== -->
        <div id="compass-container">

            <img id="compass-image" src="/images/brujula.png" alt="Brújula de orientación">

            <!-- Flecha de dirección -->
            <div id="compass-arrow">

                <div class="arrow-head"></div>

                <div class="arrow-line"></div>

            </div>

        </div>




        <!-- ==========================================
     BOTÓN PARA ORIENTAR EL MAPA AL NORTE
     ========================================== -->
        <button id="btn-norte" type="button" onclick="norteCameraView()" title="Orientar mapa hacia el norte"
            aria-label="Orientar mapa hacia el norte">

            🧭

        </button>

        <button class="btn-control btn-reset" onclick="resetCameraView()" title="Restablecer vista original">

            🏠

        </button>

        <button class="btn-control" onclick="zoomIn()" title="Acercar">

            ➕

        </button>

        <button class="btn-control" onclick="zoomOut()" title="Alejar">

            ➖

        </button>

    </div>

    <div id="mascota">

        <img id="cola" th:src="@{/css/mascota/cola.png}" alt="Cola de la mascota">

        <img id="piernas" th:src="@{/css/mascota/piernas.png}" alt="Piernas de la mascota">

        <img id="torso" th:src="@{/css/mascota/torso.png}" alt="Torso de la mascota">

        <img id="cabeza" th:src="@{/css/mascota/cabeza.png}" alt="Cabeza de la mascota">

        <!-- Burbuja donde aparecerán los mensajes -->
        <div id="mascota-mensaje">
            <span id="mensaje-texto"></span>
        </div>

    </div>

    <!-- Tooltip flotante -->
    <div id="map-tooltip" class="map-tooltip"></div>

    <!-- JavaScript principal del mapa -->
    <script th:src="@{/js/mapa.js}"></script>
    <script th:src="@{/js/mascota.js}"></script>


    <!-- =========================================================
     UBICACIÓN Y EXPLORACIÓN DEL MAPA
     ========================================================= -->

    <div class="map-explore-overlay">

        <!-- Botón de ubicación -->
        <button id="btn-ubicacion" class="location-button" type="button" title="Mostrar mi ubicación"
            aria-label="Mostrar mi ubicación">

            <span class="location-icon"> 📍 </span>

            <span class="location-button-text">
                Mi ubicación
            </span>

        </button>


        <!-- Contenedor del menú Explorar -->
        <div class="explore-wrapper">

            <!-- Botón principal -->
            <button id="btn-explore" class="explore-button" type="button" aria-expanded="false"
                aria-controls="explore-menu">

                <span class="explore-icon"> 🔍 </span>

                <span class="explore-text">
                    Explorar
                </span>

                <span class="explore-arrow">
                    ▾
                </span>

            </button>


            <!-- Menú desplegable -->
            <div id="explore-menu" class="explore-menu" aria-hidden="true">

                <div class="explore-menu-header">

                    <span class="explore-menu-title">
                        Mostrar en el mapa
                    </span>

                    <button id="btn-close-explore" class="explore-close-button" type="button"
                        aria-label="Cerrar menú Explorar" title="Cerrar" onclick="closeExploreMenu();">

                        ×

                    </button>

                </div>


                <!-- Infraestructura -->
                <button class="explore-option" data-category="infraestructura" type="button">

                    <span class="explore-option-icon">
                        🏢
                    </span>

                    <span class="explore-option-text">
                        Infraestructura
                    </span>

                    <span class="explore-check">
                        ✓
                    </span>

                </button>


                <!-- Áreas comunes -->
                <button class="explore-option" data-category="comunes" type="button">

                    <span class="explore-option-icon">
                        👥
                    </span>

                    <span class="explore-option-text">
                        Áreas comunes
                    </span>

                    <span class="explore-check">
                        ✓
                    </span>

                </button>


                <!-- Espacios naturales -->
                <button class="explore-option" data-category="naturales" type="button">

                    <span class="explore-option-icon">
                        🌿
                    </span>

                    <span class="explore-option-text">
                        Espacios naturales
                    </span>

                    <span class="explore-check">
                        ✓
                    </span>

                </button>


                <!-- Indicador de entradas -->
                <div class="explore-entrances-info">

                    <span class="entrance-indicator">
                        ●
                    </span>

                    <span>
                        Entradas siempre visibles
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- Three.js -->
    <script src="/js/three.min.js"></script>

    <!-- Controles -->
    <script src="/js/OrbitControls.js"></script>

    <!-- GLTF -->
    <script src="/js/GLTFLoader.js"></script>

    <!-- Sistema de brújula -->
    <script src="/js/brujula.js"></script>

    <!-- Sistema de ubicación -->
    <script src="/js/ubicacion-config.js"></script>
    <script src="/js/ubicacion.js"></script>

    <link rel="stylesheet" href="/css/ubicacion.css">




    <!-- Visor Modal de Imagen a Pantalla Completa (Lightbox) -->
    <div id="image-lightbox-modal" class="image-lightbox-modal" onclick="closeImageLightbox(event)">
        <button class="lightbox-close-btn" onclick="closeImageLightbox(event)" title="Cerrar visor"
            aria-label="Cerrar visor">&times;</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Imagen ampliada" onclick="event.stopPropagation()">
    </div>

</body>

</html>
