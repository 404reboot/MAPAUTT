    Autor: Cristobal Torres Ramos
    Proyecto: Mapa interactivo de la UTTECAM
-->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">
        Mapa 3D UTTECAM (Blender)
    </title>

    <!-- Fuente externa -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
          rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/stylesmapa.css}">
    <link rel="stylesheet" th:href="@{/css/stylesmascota.css}">

    <!-- Librerías Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>


    <!-- Postprocesado para contornos -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/OutlinePass.js"></script>

</head>

<body>

    <!-- Pantalla de carga mientras se descarga el modelo GLB -->
    <div id="loader">

        <h2>
            Cargando Mapa 3D UTTECAM...
        </h2>

        <p>
            Por favor espera un momento
        </p>

    </div>

    <!-- Botón volver -->
    <div class="back-button-overlay">

        <a th:href="@{/}" class="btn-secondary">
            <svg class="icon"><use th:href="@{/images/icons.svg#icon-arrow-left}"></use></svg>
            Volver
        </a>

    </div>

    <!-- Contenedor donde Three.js crea el Canvas -->
    <div id="webgl-container"></div>

    <!-- Tarjeta lateral de información -->
    <div id="details-card" class="floating-details-card">

        <div class="card-header-overlay">

            <h3 id="card-title">
                Detalle
            </h3>

            <button class="close-btn" onclick="closeDetailsCard()">

                &times;

            </button>

        </div>

        <div id="card-body"></div>

    </div>

    <!-- Controles del mapa -->
    <div class="map-controls-overlay">


        <button class="btn-control btn-reset"
                onclick="resetCameraView()"
                title="Restablecer vista original">

            🏠

        </button>



        <button class="btn-control"
                onclick="zoomIn()"
                title="Acercar">

            ➕

        </button>



        <button class="btn-control"
                onclick="zoomOut()"
                title="Alejar">

            ➖

        </button>

    </div>

    <div id="mascota">

        <img id="cola" th:src="@{/css/mascota/cola.png}">

        <img id="piernas" th:src="@{/css/mascota/piernas.png}">

        <img id="torso" th:src="@{/css/mascota/torso.png}">

        <img id="cabeza" th:src="@{/css/mascota/cabeza.png}">

    </div>

    <!-- Tooltip flotante -->
    <div id="map-tooltip" class="map-tooltip"></div>

    <!-- JavaScript principal del mapa -->
    <script th:src="@{/js/mapa.js}"></script>
    <script th:src="@{/js/mascota.js}"></script>

</body>

</html>
