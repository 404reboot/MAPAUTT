<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mapa Interactivo - UTTECAM</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>

    <!-- Import map: resolves bare specifiers to vendored local copies.
         This eliminates the CDN dependency and allows the app to run in
         air-gapped or CSP-restricted environments. -->
    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three/three.module.js",
            "three/addons/loaders/GLTFLoader.js": "/vendor/three/GLTFLoader.js",
            "three/addons/controls/OrbitControls.js": "/vendor/three/OrbitControls.js"
        }
    }
    </script>
</head>
<body>
    <div id="map-container"></div>

    <!-- Application map script -->
    <script th:src="@{/js/mapa.js}" type="module"></script>
</body>
</html>
